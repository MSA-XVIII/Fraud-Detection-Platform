[project]
name = "fraud-platform"
version = "0.1.0"
description = "Real-time fraud & anomaly detection platform (streaming + ML + graph + LLM analyst)"
requires-python = ">=3.11"
dependencies = [
    # Config & schemas
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    # Streaming / messaging
    "confluent-kafka>=2.3",
    # Serving store
    "pymongo>=4.6",
    # Graph (Neo4j Aura)
    "neo4j>=5.18",
    "networkx>=3.2",
    # ML
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "shap>=0.44",
    "numpy>=1.26",
    "pandas>=2.2",
    "mlflow>=2.11",
    # Embeddings / vector
    "sentence-transformers>=2.5",
    "faiss-cpu>=1.8",
    # LLM orchestration
    "langchain>=0.1.16",
    "langchain-core>=0.1.45",
    "langchain-community>=0.0.34",
    "langchain-openai>=0.1.3",
    "langsmith>=0.1.40",
    # Dashboard
    "streamlit>=1.49",
    "pydeck>=0.8",
    "plotly>=5.20",
    # Utilities
    "tenacity>=8.2",
    "structlog>=24.1",
    "faker>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "ruff>=0.3",
    "black>=24.3",
    "mypy>=1.9",
    "types-requests",
]
finetune = [
    # Local LoRA/PEFT fine-tuning fallback (heavy; install only when needed).
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.10",
    "datasets>=2.19",
    "accelerate>=0.29",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "config", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
